name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package-version:
        description: Optional version stamp (default ci-<sha>)
        required: false
        type: string
  workflow_call:
    inputs:
      package-version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  PACKAGE_VERSION: ${{ inputs.package-version || format('ci-{0}', github.sha) }}
  PRODUCT: fn2fm
  MODULE: github.com/Dangthrimble/forscore-metadata
  BINARIES: fn2fm

jobs:
  build:
    name: Test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: macos-apple-silicon
            runner: macos-15
            goos: darwin
            goarch: arm64
          - platform: windows-x64
            runner: windows-2025
            goos: windows
            goarch: amd64
          - platform: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native build target
        run: |
          if [ "$(go env GOHOSTOS)" != "$GOOS" ] || [ "$(go env GOHOSTARCH)" != "$GOARCH" ]; then
            echo "Go host does not match the requested native target $GOOS/$GOARCH" >&2
            exit 1
          fi

      - run: go mod download
      - run: go mod verify

      - name: Run tests
        run: go test -count=1 -v ./...

      - name: Run tests with race detector
        if: matrix.platform != 'windows-arm64'
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -race ./...

      - run: go vet ./...

      - name: Build release executable
        run: |
          mkdir -p dist/bin
          ext=""
          if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-X ${MODULE}/internal/version.Version=${PACKAGE_VERSION}" -o "dist/bin/fn2fm${ext}" ./cmd/fn2fm

      - name: Test the built executable on disposable PDFs
        run: |
          ext=""
          if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
          binary="$(pwd)/dist/bin/fn2fm${ext}"
          if command -v cygpath >/dev/null 2>&1; then
            binary="$(cygpath -w "$binary")"
          fi
          FN2FM_TEST_BINARY="$binary" \
          FN2FM_TEST_VERSION="${PACKAGE_VERSION}" \
          go test -count=1 -v -run '^TestBuiltExecutable$' ./cmd/fn2fm

      - name: Package executable and instructions
        run: |
          ext=""
          if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
          go run ./cmd/buildpackage -binary "dist/bin/fn2fm${ext}" -version "${PACKAGE_VERSION}" -out dist/packages

      - name: Upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-package-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run govulncheck
        env:
          GODEBUG: netdns=cgo
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  gate:
    name: CI gate
    if: always()
    needs: [build, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.build.result }}" "${{ needs.lint.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
